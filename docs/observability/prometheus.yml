global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "pmc_single"
    static_configs:
      - targets:
          - "cache:9100"
          - "host.docker.internal:9100"

  - job_name: "pmc_cluster"
    http_sd_configs:
      - url: "http://cache-cluster:9400/discovery"
        refresh_interval: 5s
