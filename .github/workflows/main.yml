name: Continuous integration
permissions:
  contents: read

on:
  push:
    branches:
    - main
    - dev*
    - release/*
    - codex/*

env:
  DOCKER_IMAGE_NAME: my-image

jobs:
  docker_ci:
    name: Docker CI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Generate test suite
      run: pip install jinja2 && python generate_compose.py 1

    - name: Build docker images and run unit tests
      run: docker compose --profile main --profile tests --profile cluster --profile tests-cluster build

    - name: Start cache server
      run: docker compose --profile main up --detach

    - name: Run client tests
      run: docker compose --profile client-tests up
      timeout-minutes: 5

    - name: Run load and functional tests
      run: docker compose --profile tests up
      timeout-minutes: 10

    - name: Run load and functional tests (pipelined mode enabled)
      run: docker compose --profile tests-pipelined up
      timeout-minutes: 10

    - name: Run load and functional tests (RESP protocol)
      run: docker compose --profile tests-resp up
      timeout-minutes: 10

    - name: Run load and functional tests (RESP protocol, pipelined mode enabled)
      run: docker compose --profile tests-resp-pipelined up
      timeout-minutes: 10

    - name: Run load and functional tests (request-per-connection clients)
      run: docker compose --profile tests-req-per-conn up
      timeout-minutes: 10

    - name: Stop cache server
      run: docker compose --profile main down

    - name: Start cluster
      run: docker compose --profile cluster up --detach

    - name: Run cluster tests (pipelined mode enabled)
      run: docker compose --profile tests-cluster up
      timeout-minutes: 10

    - name: Stop cluster
      run: docker compose --profile cluster down

  native_cluster:
    name: Native cluster tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install native dependencies
      run: |
        set -e
        cd "$GITHUB_WORKSPACE"
        source .env
        sudo bash ./scripts/local_server_setup.bash
        sudo apt update && sudo apt upgrade -y
        sudo apt install -y git cmake build-essential libgtest-dev zlib1g-dev gcc-14 g++-14

        cd "$GITHUB_WORKSPACE"
        go install go.k6.io/xk6/cmd/xk6@latest

    - name: Configure cache server
      run: cmake --preset Release

    - name: Build cache server
      run: cmake --build out/build/Release

    - name: Build cluster launcher
      run: go build -C launcher -o ../pmc-cluster-launcher

    - name: Build C++ client integration test
      run: g++ -std=c++20 -Wall -Wextra -Werror -pedantic -O2 -pthread -Isrc tests/client_integration/client_integration_test.cpp -o client_integration_test

    - name: Start cluster
      run: |
        ./pmc-cluster-launcher ./out/build/Release/src/poor-man-s-cache 4 9101 > cluster.log 2>&1 &
        echo $! > cluster.pid
        sleep 2

    - name: Run cluster-aware client tests
      env:
        CACHE_HOST: 127.0.0.1
        CACHE_PORT: 9101
        CLUSTER_WORKERS: 4
      run: ./client_integration_test

    - name: Run cluster functional tests
      env:
        CACHE_HOST: 127.0.0.1
        CLUSTER_BASE_PORT: 9101
        TEST_ITERATIONS: 1000000
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install -r tests/requirements.txt
        python3 tests/tcp_server_cluster_test.py -p -b 256

    - name: Stop cluster
      if: always()
      run: |
        if [ -f cluster.pid ]; then
          kill -s SIGTERM $(cat cluster.pid) || true
          sleep 2
        fi
        cat cluster.log || true
